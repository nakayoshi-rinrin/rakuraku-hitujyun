<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>らくらく筆順</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --paper:#F7F2E7;
    --paper-edge:#EDE5D2;
    --ink:#2B2926;
    --sub-ink:#6B6357;
    --line:#B9AE95;
    --accent:#EB6238;
    --card:#FFFFFF;
    --shadow: 0 12px 32px rgba(43,41,38,0.10);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #FBF7EE 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #F1E9D6 0%, transparent 55%),
      var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px 56px;
  }

  .app{
    width:100%;
    max-width:560px;
    position:relative;
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.32em;
    color:var(--accent);
    font-weight:700;
    margin-bottom:6px;
  }

  h1{
    font-family:'Shippori Mincho', serif;
    font-size:30px;
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:0.04em;
  }

  p.lead{
    font-size:13.5px;
    color:var(--sub-ink);
    line-height:1.7;
    margin:0 auto;
    max-width:400px;
  }

  .fullscreen-btn{
    position:absolute;
    top:0; left:0;
    z-index:5;
    height:36px;
    padding:0 14px 0 11px;
    gap:6px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .fullscreen-btn:hover{ background:#fff; color:var(--ink); }
  .fullscreen-btn:active{ transform:scale(0.92); }
  .fullscreen-btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .board{
    margin-top:26px;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:20px 20px 18px;
    border:1px solid #EFE9DA;
  }

  .canvas-frame{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:12px;
    overflow:hidden;
    background:var(--paper);
    box-shadow: inset 0 0 0 1px var(--paper-edge);
    touch-action:none;
    cursor:crosshair;
  }

  .canvas-frame canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
  }

  #guideCanvas{ z-index:1; }
  #drawCanvas{ z-index:2; }

  .stroke-count{
    position:absolute;
    top:10px; right:12px;
    z-index:3;
    background:rgba(255,255,255,0.88);
    border:1px solid var(--paper-edge);
    border-radius:999px;
    padding:4px 12px;
    font-size:12px;
    color:var(--sub-ink);
    font-weight:500;
    pointer-events:none;
  }

  .legend-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:18px 2px 8px;
  }

  .legend-label span{
    font-size:11.5px;
    letter-spacing:0.1em;
    color:var(--sub-ink);
    font-weight:700;
  }

  .legend{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 10px;
    scrollbar-width:thin;
  }

  .chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 10px 6px 6px;
    border-radius:999px;
    background:#FBF8F1;
    border:1.5px solid transparent;
    font-size:12px;
    color:var(--sub-ink);
    white-space:nowrap;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }

  .chip .dot{
    width:18px; height:18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
    color:#fff;
    flex:0 0 auto;
  }

  .chip.active{
    border-color:var(--ink);
    background:#fff;
    transform:translateY(-1px);
    color:var(--ink);
    font-weight:700;
  }

  .controls{
    margin-top:6px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
  }

  .thickness{
    display:flex;
    gap:6px;
    background:#FBF8F1;
    padding:4px;
    border-radius:12px;
  }

  .thickness button{
    border:none;
    background:transparent;
    padding:7px 12px;
    border-radius:9px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--sub-ink);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }

  .thickness button.active{
    background:var(--ink);
    color:#fff;
  }

  .actions{
    display:flex;
    gap:8px;
    flex:1 1 auto;
    justify-content:flex-end;
  }

  .btn{
    border:none;
    border-radius:12px;
    padding:11px 16px;
    font-size:13px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .btn-ghost{
    background:#FBF8F1;
    color:var(--ink);
  }
  .btn-ghost:hover{ background:#F2ECDD; }

  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 8px 18px rgba(235,98,56,0.30);
  }
  .btn-primary:hover{ opacity:0.92; }
  .btn-primary:disabled{
    opacity:0.4;
    box-shadow:none;
    cursor:not-allowed;
  }

  .hint{
    text-align:center;
    font-size:11.5px;
    color:var(--sub-ink);
    margin-top:16px;
    opacity:0.8;
  }

  #appRoot:fullscreen,
  #appRoot:-webkit-full-screen{
    position:relative;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100vw;
    height:100vh;
    max-width:none;
    padding:24px;
    overflow:auto;
  }
  #appRoot:fullscreen .board,
  #appRoot:-webkit-full-screen .board{
    width:min(88vh, 640px);
    max-width:92vw;
  }
  #appRoot:fullscreen header,
  #appRoot:-webkit-full-screen header{
    margin-bottom:14px;
  }

  @media (max-width:420px){
    h1{ font-size:25px; }
    .actions{ justify-content:stretch; width:100%; }
    .btn{ flex:1; justify-content:center; }
    .controls{ flex-direction:column; align-items:stretch; }
    .thickness{ justify-content:center; }
  }
</style>
</head>
<body>

<div class="app" id="appRoot">
  <button class="fullscreen-btn" id="fullscreenBtn" title="全画面表示" aria-label="全画面表示">
    <svg id="fsIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
    </svg>
    <span>ぜんがめん</span>
  </button>
  <header>
    <div class="eyebrow">HITSUJUN COLOR NOTE</div>
    <h1>らくらくひつじゅん</h1>
    <p class="lead">マス目の中に文字を書くと、画数ごとに色が順番に変わります。書き始めの場所には画数の番号が入ります。</p>
  </header>

  <div class="board">
    <div class="canvas-frame" id="frame">
      <canvas id="guideCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <div class="stroke-count" id="strokeCount">0 画</div>
    </div>

    <div class="legend-label">
      <span>配色の順番</span>
    </div>
    <div class="legend" id="legend"></div>

    <div class="controls">
      <div class="thickness" id="thickness">
        <button data-w="6">細</button>
        <button data-w="11" class="active">中</button>
        <button data-w="18">太</button>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="undoBtn">✦ もどる</button>
        <button class="btn btn-ghost" id="clearBtn">✦ けす</button>
        <button class="btn btn-primary" id="saveBtn" disabled>ほぞんする</button>
      </div>
    </div>
  </div>

  <p class="hint">保存した画像には、マス目は写らず文字と番号だけが残ります。</p>
<p class="hint">きだっち＠明倫小</p>
</div>

<script>
(function(){
  const PALETTE = [
    { name:'藍色',   hex:'#1D5B8C' },
    { name:'朱色',   hex:'#EB6238' },
    { name:'山吹色', hex:'#F2A900' },
    { name:'若竹色', hex:'#4C9A63' },
    { name:'江戸紫', hex:'#7C5AA0' },
    { name:'紅梅色', hex:'#E2618C' },
    { name:'青竹色', hex:'#1E8C7B' },
    { name:'雀茶',   hex:'#8B5A3C' },
    { name:'群青色', hex:'#2A4B8D' },
    { name:'茜色',   hex:'#C1440E' },
    { name:'萌黄色', hex:'#7BA23F' },
    { name:'桔梗色', hex:'#5B4E8C' },
    { name:'蘇芳',   hex:'#9E3D3D' },
    { name:'鶯色',   hex:'#8C8B4A' },
    { name:'瑠璃色', hex:'#275DAD' },
    { name:'柿色',   hex:'#CB6D3E' },
    { name:'常磐色', hex:'#00754A' },
    { name:'桜色',   hex:'#D97D96' },
    { name:'菖蒲色', hex:'#8E4585' },
    { name:'焦茶',   hex:'#4A2E23' }
  ];

  const frame = document.getElementById('frame');
  const guideCanvas = document.getElementById('guideCanvas');
  const drawCanvas = document.getElementById('drawCanvas');
  const gctx = guideCanvas.getContext('2d');
  const dctx = drawCanvas.getContext('2d');
  const legendEl = document.getElementById('legend');
  const strokeCountEl = document.getElementById('strokeCount');
  const undoBtn = document.getElementById('undoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const saveBtn = document.getElementById('saveBtn');
  const thicknessEl = document.getElementById('thickness');
  const appRoot = document.getElementById('appRoot');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fsIcon = document.getElementById('fsIcon');

  const ICON_EXPAND = '<path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M8 21H5a2 2 0 0 1-2-2v-3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>';
  const ICON_SHRINK = '<path d="M9 3v3a2 2 0 0 1-2 2H4"></path><path d="M15 3v3a2 2 0 0 0 2 2h3"></path><path d="M9 21v-3a2 2 0 0 0-2-2H4"></path><path d="M15 21v-3a2 2 0 0 1 2-2h3"></path>';

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function updateFullscreenIcon(){
    fsIcon.innerHTML = isFullscreen() ? ICON_SHRINK : ICON_EXPAND;
    fullscreenBtn.title = isFullscreen() ? '全画面を解除' : '全画面表示';
    fullscreenBtn.setAttribute('aria-label', fullscreenBtn.title);
    fullscreenBtn.querySelector('span').textContent = isFullscreen() ? 'もどる' : 'ぜんがめん';
  }

  function toggleFullscreen(){
    if (!isFullscreen()){
      const req = appRoot.requestFullscreen || appRoot.webkitRequestFullscreen;
      if (req) req.call(appRoot);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  }

  fullscreenBtn.addEventListener('click', toggleFullscreen);
  ['fullscreenchange','webkitfullscreenchange'].forEach(evt=>{
    document.addEventListener(evt, () => {
      updateFullscreenIcon();
      requestAnimationFrame(sizeCanvases);
    });
  });

  let penWidth = 11;
  let strokes = [];      // {colorIndex, points:[{x,y}]}
  let current = null;
  let dpr = Math.max(window.devicePixelRatio || 1, 1);
  let size = 0;

  function buildLegend(){
    legendEl.innerHTML = '';
    PALETTE.forEach((c, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.dataset.idx = i;
      chip.innerHTML = `<span class="dot" style="background:${c.hex}">${i+1}</span>${c.name}`;
      legendEl.appendChild(chip);
    });
    highlightLegend();
  }

  function highlightLegend(){
    const nextIdx = strokes.length % PALETTE.length;
    [...legendEl.children].forEach((chip, i) => {
      chip.classList.toggle('active', i === nextIdx);
    });
    const activeChip = legendEl.children[nextIdx];
    if (activeChip) activeChip.scrollIntoView({ inline:'center', behavior:'smooth', block:'nearest' });
  }

  function sizeCanvases(){
    size = frame.clientWidth;
    [guideCanvas, drawCanvas].forEach(cv => {
      cv.width = size * dpr;
      cv.height = size * dpr;
    });
    gctx.setTransform(dpr,0,0,dpr,0,0);
    dctx.setTransform(dpr,0,0,dpr,0,0);
    drawGuide();
    redrawStrokes();
  }

  function drawGuide(){
    gctx.clearRect(0,0,size,size);
    gctx.fillStyle = '#F7F2E7';
    gctx.fillRect(0,0,size,size);

    gctx.strokeStyle = '#C9BFA1';
    gctx.lineWidth = 1;
    gctx.strokeRect(0.5,0.5,size-1,size-1);

    gctx.save();
    gctx.strokeStyle = '#CBC1A5';
    gctx.setLineDash([6,7]);
    gctx.lineWidth = 1;
    gctx.beginPath();
    gctx.moveTo(size/2, 0); gctx.lineTo(size/2, size);
    gctx.moveTo(0, size/2); gctx.lineTo(size, size/2);
    gctx.stroke();
    gctx.restore();

  }

  function midpoint(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }

  function drawStrokePath(stroke){
    const pts = stroke.points;
    const color = PALETTE[stroke.colorIndex % PALETTE.length].hex;
    dctx.lineJoin = 'round';
    dctx.lineCap = 'round';
    dctx.strokeStyle = color;

    if (pts.length === 1){
      dctx.fillStyle = color;
      dctx.beginPath();
      dctx.arc(pts[0].x, pts[0].y, (stroke.width||penWidth)/2, 0, Math.PI*2);
      dctx.fill();
    } else {
      dctx.lineWidth = stroke.width || penWidth;
      dctx.beginPath();
      dctx.moveTo(pts[0].x, pts[0].y);
      for (let i=1;i<pts.length-1;i++){
        const m = midpoint(pts[i], pts[i+1]);
        dctx.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y);
      }
      dctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
      dctx.stroke();
    }

    drawBadge(stroke);
  }

  function drawBadge(stroke){
    const p = stroke.points[0];
    const color = PALETTE[stroke.colorIndex % PALETTE.length].hex;
    const label = String(stroke.number);
    const r = label.length > 1 ? 13 : 11;
    let ox = -16, oy = -16;
    if (p.x < 26) ox = 16;
    if (p.y < 26) oy = 16;
    const bx = Math.min(Math.max(p.x + ox, r+2), size - r - 2);
    const by = Math.min(Math.max(p.y + oy, r+2), size - r - 2);

    dctx.beginPath();
    dctx.arc(bx, by, r, 0, Math.PI*2);
    dctx.fillStyle = '#FFFFFF';
    dctx.fill();
    dctx.lineWidth = 2;
    dctx.strokeStyle = color;
    dctx.stroke();

    dctx.fillStyle = color;
    dctx.font = (label.length > 1 ? '700 10.5px' : '700 12px') + ' "Zen Kaku Gothic New", sans-serif';
    dctx.textAlign = 'center';
    dctx.textBaseline = 'middle';
    dctx.fillText(label, bx, by+0.5);
  }

  function redrawStrokes(){
    dctx.clearRect(0,0,size,size);
    strokes.forEach(drawStrokePath);
  }

  function updateUI(){
    strokeCountEl.textContent = strokes.length + ' 画';
    saveBtn.disabled = strokes.length === 0;
    undoBtn.disabled = strokes.length === 0;
    highlightLegend();
  }

  function getPos(e){
    const rect = drawCanvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (size/rect.width),
      y: (e.clientY - rect.top) * (size/rect.height)
    };
  }

  function onPointerDown(e){
    drawCanvas.setPointerCapture(e.pointerId);
    const pos = getPos(e);
    current = {
      colorIndex: strokes.length % PALETTE.length,
      number: strokes.length + 1,
      width: penWidth,
      points: [pos]
    };
  }

  function onPointerMove(e){
    if (!current) return;
    const pos = getPos(e);
    current.points.push(pos);
    redrawStrokes();
    drawStrokePath(current);
  }

  function finishStroke(e){
    if (!current) return;
    if (current.points.length === 1){
      current.points.push({ x: current.points[0].x + 0.01, y: current.points[0].y + 0.01 });
    }
    strokes.push(current);
    current = null;
    redrawStrokes();
    updateUI();
  }

  drawCanvas.addEventListener('pointerdown', onPointerDown);
  drawCanvas.addEventListener('pointermove', onPointerMove);
  drawCanvas.addEventListener('pointerup', finishStroke);
  drawCanvas.addEventListener('pointercancel', finishStroke);
  drawCanvas.addEventListener('pointerleave', (e)=>{ if(e.buttons===0) return; });

  undoBtn.addEventListener('click', () => {
    strokes.pop();
    redrawStrokes();
    updateUI();
  });

  clearBtn.addEventListener('click', () => {
    strokes = [];
    current = null;
    redrawStrokes();
    updateUI();
  });

  saveBtn.addEventListener('click', () => {
    const out = document.createElement('canvas');
    out.width = size * dpr;
    out.height = size * dpr;
    const octx = out.getContext('2d');
    octx.setTransform(dpr,0,0,dpr,0,0);
    octx.fillStyle = '#FFFFFF';
    octx.fillRect(0,0,size,size);
    octx.drawImage(drawCanvas, 0, 0, size, size);

    out.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ts = new Date();
      const stamp = ts.getFullYear()+String(ts.getMonth()+1).padStart(2,'0')+String(ts.getDate()).padStart(2,'0')+'_'+String(ts.getHours()).padStart(2,'0')+String(ts.getMinutes()).padStart(2,'0');
      a.href = url;
      a.download = `hitsujun_${stamp}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });

  thicknessEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    penWidth = Number(btn.dataset.w);
    [...thicknessEl.children].forEach(b => b.classList.toggle('active', b===btn));
  });

  window.addEventListener('resize', () => {
    dpr = Math.max(window.devicePixelRatio || 1, 1);
    sizeCanvases();
  });

  buildLegend();
  sizeCanvases();
  updateUI();
  updateFullscreenIcon();
})();
</script>

</body>
</html>
